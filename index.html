<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolas Papelaria Personalizada | Site Oficial</title>
    <!-- Fontes Premium e Ícones -->
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://unpkg.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #fafafa;
            color: #1e1b4b;
            padding-top: 80px;
        }

        /* NAVBAR / MENU SUPERIOR COMPLETO */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 24px;
            color: #764ba2;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #764ba2;
        }

        .nav-whatsapp-btn {
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .nav-whatsapp-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        /* SEÇÃO 1: INÍCIO (HERO BANNER) */
        .hero-section {
            background: linear-gradient(135deg, #fff1f2 0%, #fdf2f8 50%, #f3e8ff 100%);
            padding: 100px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            border-bottom-left-radius: 60px;
            border-bottom-right-radius: 60px;
        }

        .hero-content {
            max-width: 600px;
            text-align: left;
        }

        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 46px;
            color: #1e1b4b;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-content p {
            color: #4b5563;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* CONTAINER DA FOTO DA MENINA (ROSTO DA MARCA) */
        .hero-avatar-container {
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, #db2777, #764ba2);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            color: white;
            box-shadow: 0 30px 60px rgba(118, 75, 162, 0.2);
            overflow: hidden;
            position: relative;
        }

        .hero-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* SEÇÃO 2: CATÁLOGO COMPLETO POR ABAS/CATEGORIAS */
        .catalog-section {
            padding: 100px 8%;
            max-width: 1300px;
            margin: 0 auto;
            text-align: center;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 50px;
            color: #1e1b4b;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
            text-align: left;
        }

        .product-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 26px 45px rgba(118, 75, 162, 0.08);
        }

        .product-image {
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 54px;
        }

        .p-topo { background: linear-gradient(135deg, #fed7aa 0%, #fbcfe8 100%); }
        .p-caixinha { background: linear-gradient(135deg, #fef08a 0%, #fbcfe8 100%); }
        .p-balao { background: linear-gradient(135deg, #bfdbfe 0%, #fbcfe8 100%); }
        .p-kit { background: linear-gradient(135deg, #fbcfe8 0%, #c7d2fe 100%); }

        .product-info {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-tag {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #db2777;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 10px;
        }

        .product-desc {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 18px;
            border-top: 1px solid #f3f4f6;
        }

        .product-price {
            font-size: 15px;
            font-weight: 800;
            color: #1e1b4b;
        }

        .order-btn {
            background: #10b981;
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* SEÇÃO 3: SOBRE NÓS */
        .about-section {
            background: #f3e8ff;
            padding: 90px 8%;
            text-align: center;
            border-radius: 50px;
            max-width: 1150px;
            margin: 40px auto;
        }

        .about-content {
            max-width: 700px;
            margin: 0 auto;
        }

        .about-content p {
            font-size: 16px;
            line-height: 1.8;
            color: #4b5563;
            margin-top: 20px;
        }

        /* SEÇÃO 4: CONTATO & LINK INFINITYPAY */
        .contact-section {
            padding: 100px 8%;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-card {
            background: white;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            border: 1px solid #f3f4f6;
        }

        .btn-infinity-store {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #000000;
            color: white;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* RODAPÉ */
        footer {
            background: #111827;
            color: #9ca3af;
            padding: 40px 8%;
            text-align: center;
            font-size: 12px;
            margin-top: 80px;
        }

        .msp-footer {
            font-weight: 700;
            color: #a78bfa;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 900px) {
            .hero-section { flex-direction: column; text-align: center; padding: 60px 5%; }
            .hero-content { text-align: center; }
            .hero-avatar-container { width: 240px; height: 240px; font-size: 80px; }
            nav { display: none; } /* Esconde o menu extenso no celular para simplificar */
        }
    </style>
</head>
<body>

    <!-- NAVBAR / MENU SUPERIOR -->
    <header>
        <a href="#inicio" class="logo">Carolas Papelaria</a>
        <nav>
            <a href="#inicio">Início</a>
            <a href="#catalogo">Catálogo</a>
            <a href="#sobre">Sobre Nós</a>
            <a href="#contato">Contato</a>
        </nav>
        <a href="https://wa.me" target="_blank" class="nav-whatsapp-btn">
            <i class="ph ph-whatsapp-logo"></i> Fazer Pedido
        </a>
    </header>

    <!-- ABA 1: INÍCIO -->
    <section id="inicio" class="hero-section">
        <div class="hero-content">
            <h1>Mimos Afetivos & Scrap Festa de Luxo</h1>
